# The engine, checked on both platforms it has to live on.
#
# Windows is not optional here: roughly a fifth of the tool surface (registry,
# services, firewall, screen and input control, winget) is Windows-only and was
# written on Linux, so the Windows job is what turns "declared" into "verified".

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Silnik (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: python -m pip install -e ".[dev]"

      - name: Testy
        run: python -m pytest -q

      # The Windows extras pull in pywin32, psutil and pillow, which is what the
      # registry, process and screen tools actually run on. Importing every tool
      # module with them present catches the mistakes a Linux box cannot.
      - name: Instalacja dodatków Windows
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[windows]"

      - name: Narzędzia Windows są naprawdę dostępne
        if: runner.os == 'Windows'
        shell: python
        run: |
          from garis.tools import build_registry

          registry = build_registry()
          missing = [s.name for s in registry.all() if not s.supported_here()]
          print(f"narzędzia: {len(registry)}, niedostępne tutaj: {missing}")
          expected = {"registry_read", "registry_write", "firewall_rule",
                      "window_list", "window_focus"}
          available = {s.name for s in registry.available()}
          absent = expected - available
          assert not absent, f"na Windows powinny działać, a nie działają: {absent}"

      - name: Pełny przebieg CLI
        shell: bash
        run: |
          python -m garis.cli doctor
          python -m garis.cli do "sprawdź, ile miejsca zostało na dysku"
          python -m garis.cli tasks
          python -m garis.cli activity --minutes 5

  quality:
    name: Lint i typy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy

  interface:
    name: Interfejs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Build (TypeScript strict + Vite)
        run: npm run build

  # The Rust shell is Windows-first but it is not Windows-only code, and most of
  # what breaks in it (a missing trait import, a moved value, a renamed plugin
  # API) breaks identically on Linux. Checking here costs three minutes and
  # catches those before the slow Windows job is even worth starting.
  shell-check:
    name: Powłoka — sprawdzenie typów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Biblioteki systemowe GTK/WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # cargo check does not link, so the Windows-only code (Mica,
          # CREATE_NO_WINDOW, the windows subsystem attribute) can be compiled
          # here. Without this the #[cfg(windows)] blocks are checked by nothing
          # at all until someone runs a Windows build.
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # generate_context! reads tauri.conf.json and wants the built front-end to
      # exist, so the interface has to be built before the shell can be checked.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Interfejs (potrzebny do generate_context!)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      # generate_context! refuses to run when a declared externalBin is missing.
      # This job only type-checks, so empty files are enough — building a real
      # Windows engine on a Linux runner is neither possible nor the point.
      - name: Atrapy sidecarów (tylko do sprawdzenia typów)
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p binaries
          touch binaries/garis-x86_64-unknown-linux-gnu
          touch binaries/garis-x86_64-pc-windows-msvc.exe

      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (kod tylko dla Windows)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

  shell:
    name: Powłoka natywna (Windows)
    runs-on: windows-latest
    needs: shell-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Zależności front-endu
        working-directory: apps/desktop
        run: npm ci

      # The installer is only worth building once it has an engine to carry.
      # build_engine.py runs the frozen binary before handing it over, so a
      # bundle that gets this far contains something that at least starts.
      - name: Silnik jako sidecar
        run: |
          python -m pip install -e ".[dev,windows]"
          python -m pip install pyinstaller
          python packaging/build_engine.py --clean

      # This is the job that matters most: the Rust shell (tray, Mica, autostart,
      # engine lifetime) was written without a Windows machine to compile it on.
      - name: Kompilacja powłoki
        working-directory: apps/desktop
        run: npm run tauri build -- --no-bundle

      - name: Instalator
        working-directory: apps/desktop
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: garis-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
