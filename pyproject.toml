[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garis-core"
version = "0.1.2"
description = "GARIS — autonomous personal AI agent runtime (outcome-driven, Windows 11 first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Cloud model providers use plain HTTPS via garis.net, so no vendor SDK is required.
# These extras only pull in engines that cannot be reimplemented cheaply.
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "openwakeword>=0.6",
]
windows = [
    "pywin32>=306",
    "psutil>=5.9",
    "pillow>=10.2",
    "pyautogui>=0.9.54",
    # Windows Core Audio. `pycaw` wraps IAudioEndpointVolume; `comtypes` is its
    # own dependency but is listed too, because `capabilities/audio.py` calls
    # `CoInitialize` directly — a COM apartment belongs to the thread that opens
    # it, and the read runs in a worker.
    "pycaw>=20240210",
    "comtypes>=1.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
garis = "garis.cli:main"
garis-server = "garis.server_agent.main:main"

[tool.setuptools.packages.find]
where = ["core/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["core/src"]
filterwarnings = ["error::DeprecationWarning:garis.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "B008",
    # ASYNC109: ruff wants callers to wrap calls in asyncio.timeout instead of
    # accepting a `timeout` argument. GARIS deliberately does the opposite: a
    # timeout is part of a tool's and a provider's contract (ToolSpec.timeout,
    # Provider.complete, LeaseManager.acquire), because the runtime — not the
    # caller — is what guarantees nothing runs unbounded.
    "ASYNC109",
]

[tool.mypy]
python_version = "3.11"
files = ["core/src/garis"]
ignore_missing_imports = true
# Off on purpose. Large parts of this codebase are platform-conditional (winreg,
# pywin32, pyautogui, psutil) and optional-dependency-conditional, so an ignore
# that is required on Windows with the extras installed is "unused" on a Linux
# CI box — and vice versa. Flagging that churn would train us to delete ignores
# the other platform needs.
warn_unused_ignores = false
